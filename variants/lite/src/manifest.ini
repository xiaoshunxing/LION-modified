	* 可以使用多个表达式每行一个。
	* 兼容nvda2026.1

-------- 以下为修改版内容 / Below is LION modified --------

版本 3.3.7（LION 修改版 lite）
	* 首个 lite 版：以 3.3.1 的单区域、原版式界面为基础
	* 客户端对齐完整版 3.3.7：支持"模型 / OCR 端点"（/ocr、/ocr-acc、/layout-parsing 或自定义）、
	  测试连接与获取模型列表合并按钮、PaddleOCR-VL 基础文本提取
	* 界面文案精简，贴近原版
	* 简洁版：xiaoshunxing"""
