name = LION-modified-lite
summary = "LION 修改版 lite"
description = """does live OCR for the whole screen, refreshing at a specified interval.
	Toggle with NVDA+alt+n.

-------- 以下为修改版内容 / Below is LION modified --------

LION 修改版 lite（LION modified lite 3.3.7）

本插件是"LION 修改版"的简洁版：界面沿用接近原版的单区域设置，识别后端改为外部 PaddleOCR HTTP 服务，
并采用与完整版相同的客户端（支持模型/OCR 端点选择、PaddleOCR-VL 文本提取）。

与完整版的区别：
* 只有一个识别区域（识别目标 + 四向裁剪），不需要区域列表；设置更少、更接近原版
* 使用经典相似度去重；没有"稳定后朗读/跟读增量"等分区策略
* 没有排队朗读
* 插件标识为 LION-modified-lite，可与完整版 LION-modified、原版 LION 同时安装，配置与翻译互不覆盖

原版作者信息完整保留；本简洁版由 xiaoshunxing 修改。"""
author = "Stefan Moisei <vortex37@gmail.com>, Cary-rowen <manchen_0528@outlook.com>, anmi2004 <123346lv@gmail.com>, hwf1324 <1398969445@qq.com>, xiaoshunxing"
url = https://github.com/xiaoshunxing/LION-modified
version = 3.3.7
changelog = """原版 LION 3.3.0：
