name: Feature request / 功能建议
description: 建议 LION 修改版新增或改进的功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述使用场景，再描述希望的行为。不要粘贴服务令牌或敏感信息。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么界面/游戏/字幕场景下需要它？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
      description: 可选。现在是怎么绕过的？
    validations:
      required: false
  - type: dropdown
    id: variant
    attributes:
      label: 相关变体
      options:
        - 完整版 LION-modified
        - lite LION-modified-lite
        - 两个都相关
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 这个建议不需要把 OCR 引擎/模型打包进插件
          required: false
  - type: markdown
    attributes:
      value: |
        AI 创作声明：本模板由 AI 参与创作。

        代码声明：本修改版代码在原版 LION 基础上由 AI 参与编写。

        模型版本：DeepSeek-V4.1-Flash。
