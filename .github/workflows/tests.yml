name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check for private paths
        shell: pwsh
        run: |
          $hits = git grep -n -I -E 'D:\\program|E:\\miniconda|C:\\Users' -- .
          if ($LASTEXITCODE -eq 0) { $hits; exit 1 }
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          Write-Host 'No private paths found.'
          exit 0

      # 先打包再测试：包级用例（test_package / lite 产物检查）只有 dist/ 里有包时才运行，
      # 它们负责校验版本号、条目清单、体积预算与"产物与 src 一致"，是发版前的最后一道闸门。
      - name: Build full add-on
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_addon.ps1 -Variant full -Python python

      - name: Build lite add-on
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_addon.ps1 -Variant lite -Python python

      - name: Run offline test suite (with built artifacts)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
          LION_SKIP_SERVICE_PROBE: "1"
          LION_TEST_LIVE: "0"
        run: python -m unittest discover -s tests -p "test_*.py"
