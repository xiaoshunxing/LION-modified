name = LION-modified
summary = "LION 修改版"
description = """does live OCR for the whole screen, refreshing at a specified interval.
	Toggle with NVDA+alt+n.

-------- 以下为修改版内容 / Below is LION modified --------

LION 修改版（LION modified 3.3.8）

识别后端由内置 PaddleOCR-json 引擎改为外部 PaddleOCR HTTP 服务；支持多个勾选的识别区域、分区可选的去重方式与排队朗读。

修改版新增：
* 多选区识别：可增删改多个矩形区域，每个区域可单独勾选，启动后所有勾选区域都会被识别
* 分区去重：每个区域可选"经典相似度 / 稳定后朗读 / 跟读增量 / 关闭"，
  既能用于影视字幕（整行显示），也能用于 RPG 那种逐字出现的对话
* 每个区域可单独设置经典相似度阈值（默认跟随全局默认值）
* 排队朗读：识别到的文本按顺序排队朗读，互不打断
* 可选"合并区域截图"：一次抓取所有区域再本地裁剪，适合区域彼此靠近时
* 外部 OCR 服务设置、令牌、请求超时、图像格式与"测试连接"
* 可自定义模型/OCR 端点（/ocr、/ocr-acc、/layout-parsing 或任意端点），支持 PaddleOCR-VL 的文本提取
* 配置节在 NVDA 2026.3 起固定为基础配置，不随配置档案（Profile）切换

插件标识为 LION-modified，可与原版 LION 同时安装，配置与翻译互不覆盖。
初始示例服务地址 http://127.0.0.1:23353（模型/端点初始示例 /ocr），可在 NVDA 设置 → LION modified 中修改。

原版作者信息完整保留；本修改版由 xiaoshunxing 修改。
Powered by dsh — https://github.com/deepseek-ai/deepseek-harness"""
author = "Stefan Moisei <vortex37@gmail.com>, Cary-rowen <manchen_0528@outlook.com>, anmi2004 <123346lv@gmail.com>, hwf1324 <1398969445@qq.com>, xiaoshunxing"
url = https://github.com/xiaoshunxing/LION-modified
version = 3.3.8
changelog = """原版 LION 3.3.0：
	* 支持了使用正则过滤识别文本的功能。
	* 可以使用多个表达式每行一个。
	* 兼容nvda2026.1

-------- 以下为修改版内容 / Below is LION modified --------

版本 3.3.8（LION 修改版）
	* 配置节在 NVDA 2026.3 起固定为基础配置：不随配置档案（Profile）与触发器变化，保存设置只写基础配置（首次需重启生效）
	* 新增每区域经典相似度阈值：可在区域编辑对话框单独设置，默认跟随全局默认值
	* “测试 / 获取模型”改为后台线程探测，不再冻结 NVDA 主线程；OCR 客户端按设置缓存，停止识别可立刻唤醒轮询
	* 新增“合并区域截图”选项（默认关闭）：一次抓取所有区域再本地裁剪，适合区域彼此靠近时
	* 设置面板注册/移除幂等，避免插件更新后出现重复面板
	* lite 版修复：长重复文本可能被反复朗读、空帧后同一句不再朗读、退出后仍在朗读
	* 文档署名统一为 dsh 徽章；兼容并测试 NVDA 2026.3
	* 配置档案全局化、区域阈值与健壮性：xiaoshunxing

版本 3.3.7（LION 修改版）
	* 界面文案精简：去重策略、区域编辑、服务设置等标签改回原版的简短风格，状态提示只保留必要信息
	* 新增 lite 版（LION 修改版 lite）：以 3.3.1 的单区域界面为基础，客户端与设置对齐本版，可与完整版并存安装
	* 界面文案精简与 lite 版：xiaoshunxing

版本 3.3.6（LION 修改版）
	* 新增"模型 / OCR 端点"设置：可编辑组合框，默认 /ocr，支持 /ocr-acc、/layout-parsing、自定义路径或完整 URL
	* 服务地址改为"基址 + 模型/端点"；老配置首次启动自动迁移，最终请求地址与 3.3.5 完全一致
	* "测试连接"与"获取模型列表"合并为一个按钮：探活 → 获取模型列表 → 校验令牌 → 快端点识别测试
	* 模型列表按通行契约优先（/models、/v1/models），没有时回退服务端 OpenAPI 端点列表并标注来源
	* 支持 PaddleOCR-VL（/layout-parsing）的基础文本提取：按版面块顺序取文本，缺字段时回退 Markdown
	* 修正此前的去重行为回归，行为与 3.3.5 一致
	* 自定义模型与模型列表发现：xiaoshunxing

版本 3.3.5（LION 修改版）
	* 修复"跟读增量"在句子稳定后的重复播报：长台词里 OCR 抖动（尤其是靠前位置的错字）不再导致整段从头重念
	* 抖动判定改为"长度自适应的编辑距离"，长句容忍 2 处识别差异；不再依赖"公共前缀占比"（该占比在长句靠前抖动时会失效）
	* 新增"模糊锚点"：已播报内容即使有一个错字，也能定位到正确续读位置
	* 跟读新增"已播报内容相似度"兜底，与"稳定后朗读"对齐
	* 纯标点片段（如单独一个"！"）不再被单独念出
	* 数字/编号变化（"第1帧"→"第2帧"、"HP: 100"→"HP: 90"）明确按新内容处理
	* 跟读重复播报修复：xiaoshunxing

版本 3.3.4（LION 修改版）
	* 修复"稳定后朗读"的重复播报：OCR 抖动（缺标点、多空格、错一个字、偶发空帧）不再让同一句被重念
	* 修复"跟读增量"的整段重读：改为按"已播报的内容前缀"定位，只念新增片段
	* 修复长句打字时被 10 秒保护提前打断的问题：只有内容真的不再增长才会兜底
	* 空帧宽限处理，避免一帧闪空就整句重念
	* 只差一个数字的变化（如"第1帧"→"第2帧"）按新内容处理，不会被当成抖动吞掉
	* 去重抖动修复：xiaoshunxing

版本 3.3.3（LION 修改版）
	* 新增分区去重策略：每个区域可选"经典（相似度）/ 稳定后朗读 / 跟读增量 / 关闭"
	* "稳定后朗读"用于 RPG 那种逐字出现的对话：等文字停止变化后整句念一次，不会只念出几个字
	* "跟读增量"用于长对话：按标点分段释放，边说边出，不会等很久才开口
	* 老区域与从旧配置迁移来的区域默认仍是"经典（相似度）"，行为与 3.3.2 完全一致
	* 去重逻辑独立成 dedup 模块，49 项纯逻辑用例覆盖打字机、逐行追加、整句替换、清空重念等场景
	* 分区去重与排队朗读：xiaoshunxing

版本 3.3.2（LION 修改版）
	* 新增多选区识别：识别区域从"单一区域"改成可增删改的区域列表，每个区域可单独勾选，启动后所有勾选区域都会被识别
	* 新增排队朗读：在设置里可打开"排队朗读"，识别到的文本按区域顺序排队朗读，互不打断；关闭时仍是打断式（多区域时只读最后一个有变化的区域）
	* 每个区域可单独选择识别目标（当前对象/全屏幕/当前窗口/当前控件）与四向裁剪百分比
	* 旧版的单区域配置会在首次启动时自动迁移为一个区域，行为保持不变
	* 每个区域独立去重、独立提示失败；某个区域出错不影响其它区域
	* 外部服务接入、多选区识别与排队朗读：xiaoshunxing

版本 3.3.1（LION 修改版）
	* 识别后端由内置 PaddleOCR-json 子进程改为外部 PaddleOCR HTTP 服务（POST /ocr）
	* 新增设置：服务地址、服务令牌、请求超时、图像格式（PNG/JPEG）、返回可视化图、最低识别分数、检测最长边、失败时提示
	* 新增"测试连接"按钮，可直接验证服务地址与令牌
	* 修复：识别内容过滤的正则只删掉部分内容时会留下多余空格，进而可能读出空内容（现在会折叠空白）
	* 插件体积由约 310 MB 降到约 60 KB：移除内置 PaddleOCR-json 引擎（296 MB）与包内从未生效的 PIL（13.9 MB，NVDA 自带 PIL 已足够）
	* 使用独立的插件 ID 与配置节，可与原版 LION 并存
	* 兼容 NVDA 2026.1 / 2026.2
Powered by dsh — https://github.com/deepseek-ai/deepseek-harness"""
docFileName = readme.html
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.3
updateChannel = None
