summary = "LION 修改版"
description = """does live OCR for the whole screen, refreshing at a specified interval.
	Toggle with NVDA+alt+n.

-------- 以下为修改版内容 --------

LION 修改版（LION modified 3.3.7）

识别后端由内置 PaddleOCR-json 引擎改为外部 PaddleOCR HTTP 服务；支持多个勾选的识别区域、分区可选的去重方式与排队朗读。

修改版新增：
* 多选区识别：可增删改多个矩形区域，每个区域可单独勾选，启动后所有勾选区域都会被识别
* 分区去重：每个区域可选“经典相似度 / 稳定后朗读 / 跟读增量 / 关闭”，既能用于影视字幕，也能用于 RPG 那种逐字出现的对话
* 排队朗读：识别到的文本按顺序排队朗读，互不打断
* 外部 OCR 服务设置、令牌、请求超时、图像格式与“测试连接”

插件标识为 LION-modified，可与原版 LION 同时安装。初始示例服务地址 http://127.0.0.1:23353，模型/端点初始示例 /ocr。

原版作者信息完整保留；本修改版由 xiaoshunxing 修改。
AI 创作声明：本修改版新增文案由我们与 AI 共同创作；上游原文除外。模型：DeepSeek-V4.1-Flash。"""
changelog = """原版 LION 3.3.0：
	* 支持了使用正则过滤识别文本的功能。
	* 可以使用多个表达式每行一个。
	* 兼容nvda2026.1

-------- 以下为修改版内容 --------

版本 3.3.7（LION 修改版）
	* 界面文案精简，标签改回原版的简短风格
	* 新增 lite 版（LION 修改版 lite），可与完整版并存
	* 界面文案精简与 lite 版：xiaoshunxing

版本 3.3.6（LION 修改版）
	* 新增“模型 / OCR 端点”设置（可编辑组合框），支持自定义端点或完整 URL
	* “测试连接”与“获取模型列表”合并为一个按钮；模型列表优先用 /models，其次服务端 OpenAPI 端点列表
	* 支持 PaddleOCR-VL（/layout-parsing）的基础文本提取
	* 修正此前的去重行为回归，行为与 3.3.5 一致
	* 自定义模型与模型列表发现：xiaoshunxing

版本 3.3.5（LION 修改版）
	* 修复“跟读增量”在句子稳定后的重复播报：长台词里靠前位置的 OCR 抖动不再导致整段从头重念
	* 抖动判定改为“长度自适应的编辑距离”，长句容忍 2 处识别差异
	* 新增“模糊锚点”：已播报内容有一个错字也能定位到续读位置
	* 跟读新增“已播报内容相似度”兜底；纯标点片段不再单独念出
	* 数字/编号变化（第1帧→第2帧、HP: 100→HP: 90）按新内容处理
	* 跟读重复播报修复：xiaoshunxing

版本 3.3.4（LION 修改版）
	* 修复"稳定后朗读"的重复播报：OCR 抖动不再让同一句被重念
	* 修复"跟读增量"的整段重读：只念新增片段
	* 修复长句打字被 10 秒保护提前打断
	* 空帧宽限处理；编号类变化（第1帧→第2帧）按新内容处理
	* 去重抖动修复：xiaoshunxing

版本 3.3.3（LION 修改版）
	* 新增分区去重策略：每个区域可选“经典（相似度）/ 稳定后朗读 / 跟读增量 / 关闭”
	* “稳定后朗读”用于 RPG 那种逐字出现的对话：等文字停止变化后整句念一次，不会只念出几个字
	* “跟读增量”用于长对话：按标点分段释放，边说边出，不会等很久才开口
	* 老区域与迁移来的区域默认仍是“经典（相似度）”，行为与 3.3.2 完全一致
	* 去重逻辑独立成 dedup 模块，纯逻辑用例覆盖打字机、逐行追加、整句替换、清空重念等场景
	* 分区去重与排队朗读：xiaoshunxing

版本 3.3.2（LION 修改版）
	* 新增多选区识别：识别区域从“单一区域”改成可增删改的区域列表，每个区域可单独勾选，启动后所有勾选区域都会被识别
	* 新增排队朗读：识别到的文本按区域顺序排队朗读，互不打断
	* 每个区域可单独选择识别目标与四向裁剪百分比
	* 旧版单区域配置首次启动自动迁移；每个区域独立去重、独立提示失败
	* 外部服务接入、多选区识别与排队朗读：xiaoshunxing

版本 3.3.1（LION 修改版）
	* 识别后端改为外部 PaddleOCR HTTP 服务
	* 新增服务地址、令牌、超时、图像格式、可视化图、最低分数、检测最长边、失败提示等设置
	* 新增“测试连接”按钮
	* 修复正则过滤可能读出空内容的问题
	* 插件体积由约 310 MB 降到约 60 KB
